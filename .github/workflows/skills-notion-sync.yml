name: Skills GitHub to Notion mirror

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: skills-github-notion-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
      NOTION_DATABASE_ID: "4152e441-b0e5-803b-9e37-ec1ee98cd465"
      NOTION_DATA_SOURCE_ID: "4152e441-b0e5-80c8-97f3-000b5cea319d"
      NOTION_VERSION: "2026-03-11"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .notion-sync/requirements.txt

      - name: Install sync dependencies
        run: python -m pip install -r .notion-sync/requirements.txt

      - name: Refresh third-party skill snapshots
        run: python .notion-sync/sync_upstreams.py

      - name: Commit upstream snapshot changes
        run: |
          git add -A -- third_party/ .notion-sync/upstreams-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh third-party Agent Skills"
            for attempt in 1 2 3; do
  git fetch origin main:refs/remotes/origin/main
  git rebase origin/main
  if git push origin HEAD:main; then
    break
  fi
  if [ "$attempt" -eq 3 ]; then
    echo "Push to main failed after 3 attempts."
    exit 1
  fi
  sleep 2
done
          fi

      - name: Mirror repository skills into Notion
        run: python .notion-sync/sync_notion.py

      - name: Persist Notion sync manifest
        run: |
          git add .notion-sync/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update Notion skills sync manifest"
            for attempt in 1 2 3; do
  git fetch origin main:refs/remotes/origin/main
  git rebase origin/main
  if git push origin HEAD:main; then
    break
  fi
  if [ "$attempt" -eq 3 ]; then
    echo "Push to main failed after 3 attempts."
    exit 1
  fi
  sleep 2
done
          fi
